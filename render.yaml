databases:
  - name: Ozymandias-db
    databaseName: ozymandias  
    user: ozymandias24        
    plan: free 
    ipAllowList: [] 

services:
  - type: web
    name: Ozymandias
    runtime: python
    plan: free 
    buildCommand: pip install -r requirements.txt
    #  Flask 웹앱(app.py)을 실행하도록 명령어를 수정했습니다!
    startCommand: "python app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: Ozymandias-db
          property: connectionString
